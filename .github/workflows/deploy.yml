name: Deploy to Xneelo

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 📦 Install dependencies
        run: npm install

      - name: 🏗️ Build Project
        run: npm run build

      - name: 📥 Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      # lftp replaces the FTP action because the host resets the data socket on
      # EPSV; this forces plain passive mode, which shared hosts handle better.
      - name: 🚀 Sync files
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
            set ftp:ssl-allow no;
            set ftp:use-epsv false;
            set ftp:passive-mode true;
            set net:max-retries 3;
            set net:timeout 20;
            set mirror:parallel-transfer-count 3;
            open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" \"$FTP_SERVER\";
            mirror --reverse --delete --verbose dist/ ./plenergy.bigondigital.online/;
          "
